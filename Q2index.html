<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 - Smart Number Validator</title>
  <!-- defer: script runs after the HTML is parsed, so the elements already exist -->
  <script src="script.js" defer></script>
</head>
<body>

  <label for="userInput">Enter a number:</label>
  <input type="text" id="userInput" placeholder="Enter a number">

  <p id="result" role="status" aria-live="polite"></p>
</body>
</html>
